name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: order-service/go.mod
          cache: false

      - name: Download dependencies
        working-directory: order-service
        run: go mod download

      - name: Build
        working-directory: order-service
        run: go build ./...
