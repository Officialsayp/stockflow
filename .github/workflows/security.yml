name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go modules
        id: readiness
        shell: bash
        run: |
          if find . -path './.git' -prune -o -name go.mod -type f -print -quit | grep -q .; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.readiness.outputs.active == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run Go vulnerability checks
        if: steps.readiness.outputs.active == 'true'
        shell: bash
        run: |
          while IFS= read -r module; do
            module_dir="$(dirname "$module")"
            echo "Scanning $module_dir"
            (cd "$module_dir" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          done < <(find . -path './.git' -prune -o -name go.mod -type f -print)
      - name: Explain inactive stage
        if: steps.readiness.outputs.active != 'true'
        run: |
          echo "Security stage is inactive: no Go modules are present in the bootstrap repository."
